name: Avo Inspector

on: [push]

jobs:
  # Build once on Node 20. serialize-javascript@7.0.3 (build-time-only security fix,
  # GHSA-5c6j-r48x-rmvq) reads the global Web Crypto `crypto` at require-time via
  # webpack -> terser, and Node exposes `globalThis.crypto` as a default global only
  # from Node 19/20+. So the build can only run on Node 20 — its `engines.node>=20`
  # is a real require-time requirement, not a conservative tag. The published SDK
  # bundle never contains serialize-javascript, so building on 20 is safe.
  build:
    name: Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install yarn dependencies
        run: yarn install --frozen-lockfile

      - name: Build Avo Inspector package
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Test twice: run the suite on Node 18 and Node 20 against the artifact built above
  # (build once, test twice). Tests run via ts-jest against src/ and never load
  # serialize-javascript, so they pass on Node 18 even though the build cannot. This
  # keeps engines.node>=18 both declared and actually tested for SDK consumers.
  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.18.x, 20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install yarn dependencies
        # `yarn install --frozen-lockfile` resolves the full dev tree, which still
        # includes serialize-javascript@7.0.3 (a webpack->terser transitive). yarn 1
        # hard-fails its engine check on the Node 18 leg even though the tests never
        # execute that package. Scope --ignore-engines to the 18 leg only so genuine
        # engine conflicts still surface on 20.x. Remove this workaround when Node 18
        # is dropped from the matrix (see AVO-3254 follow-up).
        run: yarn install --frozen-lockfile ${{ startsWith(matrix.node-version, '18') && '--ignore-engines' || '' }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Test Source
        run: |
          yarn test:browser src/ --silent
